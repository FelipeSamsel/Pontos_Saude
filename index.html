<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Pontos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg:#F7F2E6; --surface:#FFFFFF; --surface-2:#EFE8D6; --ink:#262B1E; --ink-soft:#5C6350;
    --line:#DED2AF; --accent:#4F6B41; --accent-ink:#FFFFFF; --accent-soft:#E4EBD9;
    --gold:#B98A1F; --gold-soft:#F3E3BC; --danger:#A6432A; --danger-soft:#F3DCD2;
    --shadow:0 1px 2px rgba(38,43,30,.06),0 6px 20px rgba(38,43,30,.06); --radius:14px; --radius-sm:9px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1B1E15; --surface:#24281D; --surface-2:#2C3122; --ink:#ECE7D6; --ink-soft:#ABA890;
      --line:#3C4230; --accent:#8FB37B; --accent-ink:#14180E; --accent-soft:#313B26; --gold:#D8AE55;
      --gold-soft:#3A331C; --danger:#E08363; --danger-soft:#3B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Work Sans',-apple-system,BlinkMacSystemFont,sans-serif; min-height:100vh; padding-bottom:40px; }
  h1,h2,h3,.display { font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  .wrap { max-width:640px; margin:0 auto; padding:0 18px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:20px 0 10px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-mark { width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px; flex-shrink:0; }
  .brand-name { font-size:17px; font-weight:600; font-family:'Fraunces',serif; }
  .viewer { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); }
  .viewer button { border:none; background:none; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline; }
  .hero { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; display:flex; align-items:center; gap:20px; margin-bottom:18px; }
  .ring-wrap { position:relative; width:108px; height:108px; flex-shrink:0; }
  .ring-wrap svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track { fill:none; stroke:var(--surface-2); stroke-width:10; }
  .ring-fill { fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s ease, stroke .3s ease; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-num { font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1; }
  .ring-den { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .hero-info { flex:1; min-width:0; }
  .hero-date { font-size:13px; color:var(--ink-soft); margin-bottom:4px; }
  .hero-status { font-size:15px; font-weight:500; }
  .hero-status.over { color:var(--danger); }
  .hero-status.ok { color:var(--accent); }
  .goal-edit { margin-top:8px; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
  .goal-edit input { width:56px; padding:3px 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; }
  .goal-edit button { border:none; background:none; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:3px 4px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tab-btn { appearance:none; border:none; background:none; font-size:14px; font-weight:600; color:var(--ink-soft); padding:10px 6px 12px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active { color:var(--ink); border-bottom-color:var(--accent); }
  .panel { display:none; } .panel.active { display:block; animation:fadein .25s ease; }
  @keyframes fadein { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .section-title { font-size:13px; color:var(--ink-soft); font-weight:600; margin:0 0 8px 2px; }
  .entry-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .entry-row { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; }
  .entry-name { flex:1; font-size:14px; font-weight:500; }
  .entry-qty { font-size:12px; color:var(--ink-soft); }
  .entry-pts { font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--accent); white-space:nowrap; }
  .entry-del { border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
  .entry-del:hover { color:var(--danger); background:var(--danger-soft); }
  .empty-state { text-align:center; padding:32px 16px; color:var(--ink-soft); font-size:14px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); }
  .btn { font-weight:600; font-size:14px; border-radius:10px; border:none; cursor:pointer; padding:11px 16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary { background:var(--accent); color:var(--accent-ink); width:100%; }
  .btn-ghost { background:var(--surface-2); color:var(--ink); }
  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:12px; }
  .search-box input { border:none; outline:none; background:none; flex:1; font-size:14px; color:var(--ink); }
  .search-box svg { flex-shrink:0; color:var(--ink-soft); }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); cursor:pointer; border:1px solid transparent; }
  .chip.active { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .food-row { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; }
  .food-main { flex:1; min-width:0; }
  .food-name { font-size:14px; font-weight:500; }
  .food-cat { font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .food-pts { font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--gold); background:var(--gold-soft); padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .qty-stepper { display:flex; align-items:center; gap:4px; }
  .qty-stepper button { width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .qty-stepper input { width:30px; text-align:center; border:none; background:none; color:var(--ink); font-size:13px; }
  .icon-btn { border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover { background:var(--surface-2); color:var(--ink); }
  .icon-btn.danger:hover { background:var(--danger-soft); color:var(--danger); }
  .day-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .day-date { flex:1; } .day-date .d1 { font-size:14px; font-weight:600; text-transform:capitalize; } .day-date .d2 { font-size:12px; color:var(--ink-soft); }
  .day-bar-wrap { width:60px; } .day-bar-track { height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .day-bar-fill { height:100%; background:var(--accent); border-radius:3px; } .day-bar-fill.over { background:var(--danger); }
  .day-pts { font-family:'Fraunces',serif; font-weight:600; font-size:15px; white-space:nowrap; min-width:64px; text-align:right; }
  .day-detail { background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 14px; margin:-4px 0 10px; font-size:13px; }
  .day-detail-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); }
  .day-detail-row:last-child { border-bottom:none; }
  .admin-toggle { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .admin-form { background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius-sm); padding:14px; margin-bottom:16px; display:none; }
  .admin-form.open { display:block; }
  .field-row { display:flex; gap:8px; margin-bottom:8px; } .field-row .grow { flex:1; }
  .field-row input, .field-row select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14px; }
  .field-label { font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; display:block; }
  .banner { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; text-align:center; color:var(--ink-soft); font-size:14px; margin-top:40px; }
  .confirm-row { display:flex; gap:6px; align-items:center; }
  .confirm-row button { font-size:12px; padding:5px 9px; border-radius:6px; border:none; cursor:pointer; }
  .confirm-yes { background:var(--danger); color:#fff; } .confirm-no { background:var(--surface-2); color:var(--ink); }

  /* Auth screen */
  .auth-card { max-width:380px; margin:60px auto 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; }
  .auth-tabs { display:flex; gap:0; margin-bottom:18px; border-radius:10px; background:var(--surface-2); padding:3px; }
  .auth-tab { flex:1; text-align:center; padding:8px 0; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-radius:8px; }
  .auth-tab.active { background:var(--surface); color:var(--ink); }
  .auth-field { margin-bottom:12px; }
  .auth-field label { font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .auth-field input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14px; }
  .auth-error { color:var(--danger); font-size:13px; margin-bottom:10px; min-height:0; }
  .auth-hint { font-size:12px; color:var(--ink-soft); margin-top:14px; text-align:center; }
  ::selection { background: var(--gold-soft); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">P</div><div class="brand-name">Caderno de Pontos</div></div>
    <div class="viewer" id="viewerBox"></div>
  </div>
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  if (!window.SUPABASE_URL || window.SUPABASE_URL.includes('SEU-PROJETO')) {
    document.getElementById('app').innerHTML = '<div class="banner">Configure o arquivo <b>config.js</b> com a URL e a chave anon do seu projeto Supabase antes de usar o app.</div>';
    return;
  }
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  const todayKey = () => new Date().toLocaleDateString('sv-SE');
  function fmtNum(n) { n = Math.round(n * 10) / 10; return (Number.isInteger(n) ? n.toString() : n.toFixed(1)).replace('.', ','); }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  const CATEGORIES = ['Proteínas','Carboidratos','Frutas','Vegetais','Laticínios','Gorduras e óleos','Doces e bebidas','Outros'];

  const state = {
    session: null, profile: null, isAdmin: false,
    foods: [], entries: [], history: [],
    tab: 'hoje', foodQuery: '', foodCat: 'Todos',
    adminOpen: false, editingFoodId: null, confirmDeleteId: null,
    authMode: 'login', authError: '', busy: false
  };

  const appEl = document.getElementById('app');
  const viewerBox = document.getElementById('viewerBox');

  // ---------- AUTH SCREEN ----------
  function renderAuth() {
    viewerBox.innerHTML = '';
    appEl.innerHTML = `
      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab ${state.authMode === 'login' ? 'active' : ''}" data-mode="login">Entrar</div>
          <div class="auth-tab ${state.authMode === 'signup' ? 'active' : ''}" data-mode="signup">Criar conta</div>
        </div>
        ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
        <div class="auth-field"><label>E-mail</label><input type="email" id="authEmail" autocomplete="email"></div>
        <div class="auth-field"><label>Senha</label><input type="password" id="authPass" autocomplete="${state.authMode === 'login' ? 'current-password' : 'new-password'}"></div>
        <button class="btn btn-primary" id="authSubmit" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Aguarde…' : (state.authMode === 'login' ? 'Entrar' : 'Criar conta')}</button>
        <div class="auth-hint">${state.authMode === 'login' ? 'Ainda não tem conta? Toque em "Criar conta".' : 'Depois de criar a conta, confirme o e-mail se seu projeto Supabase exigir isso.'}</div>
      </div>`;
    appEl.querySelectorAll('[data-mode]').forEach(t => t.addEventListener('click', () => { state.authMode = t.dataset.mode; state.authError = ''; renderAuth(); }));
    document.getElementById('authSubmit').addEventListener('click', submitAuth);
    [document.getElementById('authEmail'), document.getElementById('authPass')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));
  }

  async function submitAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPass').value;
    if (!email || !password) { state.authError = 'Preencha e-mail e senha.'; renderAuth(); return; }
    state.busy = true; state.authError = ''; renderAuth();
    try {
      if (state.authMode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      state.busy = false; state.authError = translateAuthError(err.message); renderAuth(); return;
    }
    state.busy = false;
  }

  function translateAuthError(msg) {
    if (/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
    if (/already registered/i.test(msg)) return 'Esse e-mail já tem uma conta. Tente entrar.';
    if (/password/i.test(msg) && /6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
    return msg;
  }

  // ---------- MAIN APP ----------
  function render() {
    if (!state.session) { renderAuth(); return; }

    viewerBox.innerHTML = `<span>${escapeHtml(state.profile?.email || '')}${state.isAdmin ? ' · admin' : ''}</span><button id="logoutBtn">sair</button>`;

    const goal = state.profile?.daily_goal ?? 21;
    const total = state.entries.reduce((s, e) => s + e.points * e.qty, 0);
    const pct = goal > 0 ? Math.min(100, (total / goal) * 100) : 0;
    const over = total > goal;
    const r = 44, circ = 2 * Math.PI * r, offset = circ - (pct / 100) * circ;

    let html = `
    <div class="hero">
      <div class="ring-wrap"><svg viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="${r}"></circle>
        <circle class="ring-fill" cx="50" cy="50" r="${r}" stroke="${over ? 'var(--danger)' : 'var(--accent)'}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
      </svg><div class="ring-center"><div class="ring-num">${fmtNum(total)}</div><div class="ring-den">de ${fmtNum(goal)}</div></div></div>
      <div class="hero-info">
        <div class="hero-date">${capitalize(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}))}</div>
        <div class="hero-status ${over ? 'over' : 'ok'}">${over ? fmtNum(total-goal)+' pontos acima da meta' : fmtNum(goal-total)+' pontos restantes hoje'}</div>
        <div class="goal-edit"><span>Meta diária:</span><input type="number" min="0" step="0.5" id="goalInput" value="${goal}"><button id="goalSaveBtn">salvar</button></div>
      </div>
    </div>
    <div class="tabs">${tabBtn('hoje','Hoje')}${tabBtn('historico','Histórico')}${tabBtn('alimentos','Alimentos')}</div>
    <div id="panels">${renderHoje()}${renderHistorico()}${renderAlimentos()}</div>`;

    appEl.innerHTML = html;
    attachHandlers();
    document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());
  }

  function tabBtn(key, label) { return `<button class="tab-btn ${state.tab===key?'active':''}" data-tab="${key}">${label}</button>`; }

  function renderHoje() {
    const entries = state.entries;
    let rows = !entries.length
      ? `<div class="empty-state">Nenhum alimento adicionado ainda hoje.<br>Toque em "Adicionar alimento" para começar.</div>`
      : `<div class="entry-list">` + entries.map(e => `
        <div class="entry-row">
          <div class="entry-name">${escapeHtml(e.food_name)} <span class="entry-qty">${e.qty!==1?'× '+fmtNum(e.qty):''}</span></div>
          <div class="entry-pts">${fmtNum(e.points*e.qty)}</div>
          <button class="entry-del" data-remove-entry="${e.id}">${iconTrash()}</button>
        </div>`).join('') + `</div>`;
    return `<div class="panel ${state.tab==='hoje'?'active':''}" data-panel="hoje">${rows}
      <button class="btn btn-primary" id="openAddBtn">${iconPlus()} Adicionar alimento</button>
      <div id="addFoodPanel"></div></div>`;
  }

  function renderHistorico() {
    let body;
    if (!state.history.length) {
      body = `<div class="empty-state">Seu histórico vai aparecer aqui conforme os dias forem passando.</div>`;
    } else {
      body = state.history.map(d => {
        const g = state.profile?.daily_goal ?? 21;
        const t = d.total; const pct = g>0?Math.min(100,(t/g)*100):0; const over = t>g;
        const dt = new Date(d.date+'T12:00:00'); const isToday = d.date===todayKey();
        return `<div class="day-card" data-day="${d.date}">
          <div class="day-date"><div class="d1">${isToday?'Hoje':capitalize(dt.toLocaleDateString('pt-BR',{weekday:'short'}))}</div><div class="d2">${dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></div>
          <div class="day-bar-wrap"><div class="day-bar-track"><div class="day-bar-fill ${over?'over':''}" style="width:${pct}%"></div></div></div>
          <div class="day-pts" style="color:${over?'var(--danger)':'var(--ink)'}">${fmtNum(t)} / ${fmtNum(g)}</div>
        </div>
        <div class="day-detail" id="detail-${d.date}" style="display:none">
          ${d.entries.length ? d.entries.map(e=>`<div class="day-detail-row"><span>${escapeHtml(e.food_name)}${e.qty!==1?' ×'+fmtNum(e.qty):''}</span><span>${fmtNum(e.points*e.qty)}</span></div>`).join('') : '<div class="day-detail-row"><span>Sem registros</span><span></span></div>'}
        </div>`;
      }).join('');
    }
    return `<div class="panel ${state.tab==='historico'?'active':''}" data-panel="historico">${body}</div>`;
  }

  function renderAlimentos() {
    const q = state.foodQuery.trim().toLowerCase();
    let list = state.foods.filter(f => (!q || f.name.toLowerCase().includes(q)) && (state.foodCat==='Todos'||f.category===state.foodCat))
      .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
    const chips = ['Todos',...CATEGORIES].map(c=>`<div class="chip ${state.foodCat===c?'active':''}" data-cat="${escapeHtml(c)}">${c}</div>`).join('');

    let adminBlock = '';
    if (state.isAdmin) {
      adminBlock = `
      <div class="admin-toggle"><span class="section-title" style="margin:0">Gerenciar lista (admin)</span>
        <button class="btn btn-ghost" id="toggleAdminForm">${state.adminOpen?'Fechar':(state.editingFoodId?'Editando…':'+ Novo alimento')}</button></div>
      <div class="admin-form ${state.adminOpen?'open':''}" id="adminForm">
        <div class="field-row"><div class="grow"><label class="field-label">Nome do alimento</label>
          <input type="text" id="foodNameInput" placeholder="Ex: Peito de frango grelhado (100g)" value="${escapeHtml(state.formName||'')}"></div></div>
        <div class="field-row">
          <div style="width:110px"><label class="field-label">Pontos</label><input type="number" step="0.5" min="0" id="foodPointsInput" value="${state.formPoints??''}"></div>
          <div class="grow"><label class="field-label">Categoria</label><select id="foodCategoryInput">${CATEGORIES.map(c=>`<option value="${c}" ${state.formCategory===c?'selected':''}>${c}</option>`).join('')}</select></div>
        </div>
        <button class="btn btn-primary" id="saveFoodBtn">${state.editingFoodId?'Salvar alterações':'Adicionar à lista'}</button>
      </div>`;
    }

    let rows = !list.length ? `<div class="empty-state">Nenhum alimento encontrado.</div>` : list.map(f => {
      if (state.isAdmin && state.editingFoodId===f.id) return '';
      const isConfirming = state.confirmDeleteId === f.id;
      return `<div class="food-row"><div class="food-main"><div class="food-name">${escapeHtml(f.name)}</div><div class="food-cat">${escapeHtml(f.category)}</div></div>
        <div class="food-pts">${fmtNum(f.points)} pts</div>
        ${state.isAdmin ? (isConfirming
          ? `<div class="confirm-row"><button class="confirm-yes" data-confirm-delete="${f.id}">Excluir</button><button class="confirm-no" data-cancel-delete="${f.id}">Cancelar</button></div>`
          : `<button class="icon-btn" data-edit-food="${f.id}">${iconEdit()}</button><button class="icon-btn danger" data-ask-delete="${f.id}">${iconTrash()}</button>`) : ''}
      </div>`;
    }).join('');

    return `<div class="panel ${state.tab==='alimentos'?'active':''}" data-panel="alimentos">${adminBlock}
      <div class="search-box">${iconSearch()}<input type="text" id="foodSearchInput" placeholder="Buscar alimento…" value="${escapeHtml(state.foodQuery)}"></div>
      <div class="chip-row">${chips}</div>${rows}</div>`;
  }

  function iconPlus(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;}
  function iconTrash(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`;}
  function iconEdit(){return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;}
  function iconSearch(){return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;}

  function attachHandlers() {
    appEl.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab; state.adminOpen=false; state.editingFoodId=null; render();}));
    const goalBtn = document.getElementById('goalSaveBtn');
    if (goalBtn) goalBtn.addEventListener('click', async () => {
      const val = parseFloat(document.getElementById('goalInput').value);
      if (!isNaN(val) && val>=0) await saveGoal(val);
    });
    const openAddBtn = document.getElementById('openAddBtn');
    if (openAddBtn) openAddBtn.addEventListener('click', renderAddFoodPanel);
    appEl.querySelectorAll('[data-remove-entry]').forEach(b=>b.addEventListener('click',()=>removeEntry(b.dataset.removeEntry)));
    appEl.querySelectorAll('[data-day]').forEach(card=>card.addEventListener('click',()=>{
      const box = document.getElementById('detail-'+card.dataset.day);
      if (box) box.style.display = box.style.display==='none' ? 'block' : 'none';
    }));
    const searchInput = document.getElementById('foodSearchInput');
    if (searchInput) searchInput.addEventListener('input', () => { state.foodQuery = searchInput.value; render(); refocus('foodSearchInput'); });
    appEl.querySelectorAll('[data-cat]').forEach(c=>c.addEventListener('click',()=>{state.foodCat=c.dataset.cat; render();}));
    const toggleAdmin = document.getElementById('toggleAdminForm');
    if (toggleAdmin) toggleAdmin.addEventListener('click', () => {
      state.adminOpen = !state.adminOpen; state.editingFoodId=null; state.formName=''; state.formPoints=''; state.formCategory=CATEGORIES[0]; render();
    });
    const saveFoodBtn = document.getElementById('saveFoodBtn');
    if (saveFoodBtn) saveFoodBtn.addEventListener('click', saveFood);
    appEl.querySelectorAll('[data-edit-food]').forEach(b=>b.addEventListener('click',()=>startEditFood(b.dataset.editFood)));
    appEl.querySelectorAll('[data-ask-delete]').forEach(b=>b.addEventListener('click',()=>{state.confirmDeleteId=b.dataset.askDelete; render();}));
    appEl.querySelectorAll('[data-cancel-delete]').forEach(b=>b.addEventListener('click',()=>{state.confirmDeleteId=null; render();}));
    appEl.querySelectorAll('[data-confirm-delete]').forEach(b=>b.addEventListener('click',()=>deleteFood(b.dataset.confirmDelete)));
  }
  function refocus(id){const el=document.getElementById(id); if(el){el.focus(); const v=el.value; el.value=''; el.value=v;}}

  function startEditFood(id) {
    const f = state.foods.find(x=>x.id===id); if(!f) return;
    state.editingFoodId=id; state.adminOpen=true; state.formName=f.name; state.formPoints=f.points; state.formCategory=f.category; render();
  }

  let addPanelState = { query:'', qty:{} };
  function renderAddFoodPanel() {
    const container = document.getElementById('addFoodPanel'); if(!container) return;
    const q = addPanelState.query.trim().toLowerCase();
    const list = state.foods.filter(f=>!q||f.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).slice(0,40);
    container.innerHTML = `<div style="margin-top:14px"><div class="search-box">${iconSearch()}<input type="text" id="apSearch" placeholder="Buscar na lista de alimentos…" value="${escapeHtml(addPanelState.query)}"></div>
      <div id="apList">${list.length ? list.map(foodPickRow).join('') : '<div class="empty-state">Nenhum alimento encontrado. Peça ao admin para cadastrar.</div>'}</div></div>`;
    const s = document.getElementById('apSearch'); s.focus();
    s.addEventListener('input', () => { addPanelState.query = s.value; renderAddFoodPanel(); refocusEl(document.getElementById('apSearch')); });
    container.querySelectorAll('[data-qty-minus]').forEach(b=>b.addEventListener('click',()=>stepQty(b.dataset.qtyMinus,-1)));
    container.querySelectorAll('[data-qty-plus]').forEach(b=>b.addEventListener('click',()=>stepQty(b.dataset.qtyPlus,1)));
    container.querySelectorAll('[data-pick-food]').forEach(b=>b.addEventListener('click',()=>confirmAddEntry(b.dataset.pickFood)));
  }
  function refocusEl(el){if(!el)return; const v=el.value; el.value=''; el.value=v;}
  function stepQty(id,delta){const cur=addPanelState.qty[id]??1; addPanelState.qty[id]=Math.max(0.5,Math.round((cur+delta*0.5)*2)/2); renderAddFoodPanel();}
  function foodPickRow(f) {
    const q = addPanelState.qty[f.id]??1;
    return `<div class="food-row"><div class="food-main"><div class="food-name">${escapeHtml(f.name)}</div><div class="food-cat">${escapeHtml(f.category)} · ${fmtNum(f.points)} pts/un.</div></div>
      <div class="qty-stepper"><button data-qty-minus="${f.id}">−</button><input type="text" readonly value="${fmtNum(q)}"><button data-qty-plus="${f.id}">+</button></div>
      <button class="icon-btn" style="color:var(--accent)" data-pick-food="${f.id}">${iconPlus()}</button></div>`;
  }

  async function confirmAddEntry(foodId) {
    const f = state.foods.find(x=>x.id===foodId); if(!f) return;
    const qty = addPanelState.qty[foodId] ?? 1;
    const { data, error } = await sb.from('entries').insert({
      user_id: state.session.user.id, food_id: f.id, food_name: f.name, points: f.points, qty, entry_date: todayKey()
    }).select().single();
    if (error) { console.error(error); return; }
    state.entries = [...state.entries, data];
    document.getElementById('addFoodPanel').innerHTML = '';
    addPanelState = { query:'', qty:{} };
    render();
  }

  async function removeEntry(id) {
    const { error } = await sb.from('entries').delete().eq('id', id);
    if (error) { console.error(error); return; }
    state.entries = state.entries.filter(e => e.id !== id);
    render();
  }

  async function saveGoal(val) {
    const { error } = await sb.from('profiles').update({ daily_goal: val }).eq('id', state.session.user.id);
    if (error) { console.error(error); return; }
    state.profile = { ...state.profile, daily_goal: val };
    render();
  }

  async function saveFood() {
    const name = (document.getElementById('foodNameInput').value||'').trim();
    const points = parseFloat(document.getElementById('foodPointsInput').value);
    const category = document.getElementById('foodCategoryInput').value;
    if (!name || isNaN(points) || points<0) return;
    if (state.editingFoodId) {
      const { error } = await sb.from('foods').update({ name, points, category }).eq('id', state.editingFoodId);
      if (error) { console.error(error); return; }
    } else {
      const { error } = await sb.from('foods').insert({ name, points, category });
      if (error) { console.error(error); return; }
    }
    state.adminOpen=false; state.editingFoodId=null; state.formName=''; state.formPoints=''; state.formCategory=CATEGORIES[0];
    await loadFoods(); render();
  }

  async function deleteFood(id) {
    const { error } = await sb.from('foods').delete().eq('id', id);
    if (error) { console.error(error); return; }
    state.confirmDeleteId=null; await loadFoods(); render();
  }

  // ---------- data loading ----------
  async function loadFoods() {
    const { data, error } = await sb.from('foods').select('*');
    if (!error) state.foods = data || [];
  }
  async function loadProfile() {
    let { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
    if (!data) {
      // fallback in case the signup trigger hasn't run yet
      const ins = await sb.from('profiles').insert({ id: state.session.user.id, email: state.session.user.email }).select().maybeSingle();
      data = ins.data;
    }
    state.profile = data;
    state.isAdmin = data?.role === 'admin';
  }
  async function loadToday() {
    const { data, error } = await sb.from('entries').select('*').eq('user_id', state.session.user.id).eq('entry_date', todayKey());
    if (!error) state.entries = data || [];
  }
  async function loadHistory() {
    const since = new Date(); since.setDate(since.getDate() - 30);
    const { data, error } = await sb.from('entries').select('*').eq('user_id', state.session.user.id).gte('entry_date', since.toISOString().slice(0,10)).order('entry_date', { ascending: false });
    if (error) { state.history = []; return; }
    const byDate = {};
    (data||[]).forEach(e => {
      if (!byDate[e.entry_date]) byDate[e.entry_date] = { date: e.entry_date, entries: [], total: 0 };
      byDate[e.entry_date].entries.push(e);
      byDate[e.entry_date].total += e.points * e.qty;
    });
    state.history = Object.values(byDate).sort((a,b)=>b.date.localeCompare(a.date));
  }

  async function loadAll() {
    await Promise.all([loadFoods(), loadProfile()]);
    await Promise.all([loadToday(), loadHistory()]);
    render();
  }

  // ---------- boot ----------
  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if (session) { loadAll(); } else { render(); }
  });
  sb.auth.getSession().then(({ data }) => { state.session = data.session; if (state.session) loadAll(); else render(); });
})();
</script>
</body>
</html>
